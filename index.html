<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAgent Enterprise | GitHub Copilot Agentic Marketplace & Artifact Registry</title>
  <meta name="description" content="Enterprise Agentic Marketplace for GitHub Copilot in VS Code. AI Engineers publish agents and maintain artifacts (demo videos, input/output docs, knowledge base). Developers download 1-click VS Code setups. Business Managers track adoption and ROI.">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- TailwindCSS Script CDN for utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- JSZip for dynamic client-side artifact ZIP packaging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Enterprise Custom Design System CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#0a0d14] text-[#f8fafc] min-h-screen flex flex-col antialiased selection:bg-[#8957e5] selection:text-white">

  <!-- Top Navigation Header Container -->
  <div id="header-container"></div>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="main-content">
      <!-- Injected by JavaScript App Router -->
      <div class="flex items-center justify-center min-h-[50vh]">
        <div class="flex items-center gap-3 text-purple-400 font-semibold text-sm">
          <div class="w-5 h-5 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
          <span>Loading NexusAgent Enterprise Marketplace...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Enterprise Footer -->
  <footer class="border-t border-[var(--border-subtle)] bg-[#07090f] py-8 text-xs text-[var(--text-muted)] mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 rounded-lg bg-purple-600 flex items-center justify-center text-white font-bold text-xs">N</div>
        <span>NexusAgent Enterprise Platform • Standardized on <strong>GitHub Copilot for VS Code</strong></span>
      </div>
      <div class="flex items-center gap-6">
        <span class="flex items-center gap-1.5"><span class="status-dot status-dot-pulse bg-emerald-400"></span> SOC2 Type II Certified</span>
        <span>OWASP Top 10 Guardrails</span>
        <span>Version 2.4.0-enterprise</span>
      </div>
    </div>
  </footer>

  <!-- Modal Containers -->
  <div id="agent-detail-modal-container"></div>
  <div id="prompt-editor-modal-container"></div>
  <div id="audit-payload-modal-container"></div>
  <div id="test-guide-modal-container"></div>
  <div id="dashboard-formula-modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main Application Script (ES Modules) -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
